<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mega Utility - ৭০টি অফলাইন স্মার্ট টুলস</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --surface: #ffffff;
      --background: #f8fafc;
      --surface-variant: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --card-radius: 18px;
      --danger: #ef4444;
      --success: #16a34a;
      --cat-daily: #2563eb;
      --cat-storage: #ea580c;
      --cat-media: #9333ea;
      --cat-text: #0d9488;
      --cat-sensors: #0284c7;
      --cat-units: #4f46e5;
      --cat-finance: #059669;
    }

    [data-theme="dark"] {
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: #1e293b;
      --surface: #0f172a;
      --background: #020617;
      --surface-variant: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--background);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Mobile Container Frame */
    .app-container {
      width: 100%;
      max-width: 500px;
      background-color: var(--surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    /* Header */
    header {
      padding: 16px 18px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 500;
    }

    .badge-count {
      background: var(--primary-light);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    /* Search Bar */
    .search-wrapper {
      padding: 6px 18px 12px;
      position: sticky;
      top: 68px;
      background: var(--surface);
      z-index: 19;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--surface-variant);
      border-radius: 14px;
      padding: 10px 14px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .search-box svg {
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      margin-right: 10px;
      flex-shrink: 0;
    }

    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 14px;
      color: var(--text-main);
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      padding: 2px;
    }

    /* Category Filter Chips */
    .chips-scroller {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 18px 12px;
      scrollbar-width: none;
    }

    .chips-scroller::-webkit-scrollbar {
      display: none;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      background: var(--surface-variant);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    /* Tool Grid */
    .content-area {
      flex: 1;
      padding: 6px 18px 90px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .tool-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 146px;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .tool-card:active {
      transform: scale(0.97);
    }

    .tool-card:hover {
      border-color: var(--primary);
      box-shadow: 0 6px 18px -4px rgba(0, 0, 0, 0.06);
    }

    .tool-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .tool-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .fav-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: var(--text-muted);
      padding: 4px;
      transition: transform 0.15s ease;
    }

    .fav-btn.active {
      color: var(--danger);
    }

    .tool-info h4 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-info p {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tool-cat-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .tool-cat-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 500px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 12px;
      z-index: 25;
      backdrop-filter: blur(10px);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      position: relative;
      flex: 1;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
    }

    .nav-badge {
      position: absolute;
      top: -2px;
      right: 28%;
      background: var(--danger);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
    }

    /* Modal / Bottom Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-sheet {
      background: var(--surface);
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      border-radius: 26px 26px 0 0;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-handle-bar {
      width: 38px;
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      margin: 10px auto 4px;
    }

    .modal-header {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .modal-title h3 {
      font-size: 17px;
      font-weight: 700;
    }

    .modal-title p {
      font-size: 12px;
      color: var(--primary);
      font-weight: 600;
    }

    .close-modal-btn {
      background: var(--surface-variant);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-main);
    }

    .modal-body {
      padding: 18px 20px 30px;
      overflow-y: auto;
      max-height: calc(85vh - 70px);
    }

    /* Common UI in tools */
    .tool-input-group {
      margin-bottom: 12px;
    }

    .tool-input-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .tool-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      background: var(--surface);
      color: var(--text-main);
      outline: none;
    }

    .tool-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .tool-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tool-btn:active {
      background: var(--primary-hover);
    }

    .result-card {
      background: var(--surface-variant);
      border-radius: 14px;
      padding: 16px;
      margin-top: 14px;
      border: 1px solid var(--border);
    }

    .result-card h5 {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .result-value {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
    }

    .unit-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 13.5px;
    }

    .unit-row:last-child {
      border-bottom: none;
    }

    /* Calculator Grid */
    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .calc-btn {
      padding: 16px 0;
      font-size: 18px;
      font-weight: 700;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-variant);
      color: var(--text-main);
      cursor: pointer;
    }

    .calc-btn.op {
      background: var(--primary-light);
      color: var(--primary);
    }

    .calc-btn.eq {
      background: var(--primary);
      color: #fff;
      grid-column: span 2;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div>
        <h1 class="brand-title">Mega Utility</h1>
        <p class="brand-subtitle">৭০টি অফলাইন স্মার্ট টুলস প্যাকেজ</p>

    <!-- Search Bar -->

        <input type="text" id="searchInput" placeholder="টুলস খুঁজুন / Search 70 offline tools..." autocomplete="off">

    <!-- Category Filter Chips -->

    <div class="content-area" id="mainContent">

    <!-- Bottom Navigation Bar -->

          <rect x="3" y="14" width="7" height="7"></rect>

        </svg>
        <span>প্রিয় টুলস</span>
        <span class="nav-badge" id="favBadge" style="display: none;">0</span>
      </button>

      <button class="nav-item" id="navAbout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <span>তথ্য ও সেটিংস</span>
      </button>
    </nav>
  </div>

  <!-- Bottom Sheet Modal for Tools -->
  <div class="modal-overlay" id="toolModal">
    <div class="modal-sheet">
      <div class="modal-handle-bar"></div>
      <div class="modal-header">
        <div class="modal-title">
          <h3 id="modalToolName">Tool Title</h3>
          <p id="modalToolBangla">বাংলা নাম</p>
        </div>
        <button class="close-modal-btn" id="closeModal">✕</button>
      </div>
      <div class="modal-body" id="modalToolContent">
        <!-- Injected tool UI -->
      </div>
    </div>
  </div>

    function applyTheme(mode) {
      themeMode = mode;
      localStorage.setItem("mega_theme_mode", mode);
      if (mode === "DARK") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else if (mode === "LIGHT") {
        document.documentElement.removeAttribute("data-theme");
      } else {
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (prefersDark) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.removeAttribute("data-theme");
        }
      }
      if (currentTab === "ABOUT") {
        renderAboutView();
      }

    applyTheme(themeMode);

    function renderTools() {

        list = list.filter(t => favorites.includes(t.id));

      if (currentCategory !== "ALL") {

      const q = searchQuery.trim().toLowerCase();

        list = list.filter(t =>
          t.name.toLowerCase().includes(q) ||
          t.banglaName.toLowerCase().includes(q) ||
          t.desc.toLowerCase().includes(q) ||
          t.tags.some(tag => tag.toLowerCase().includes(q))
        );
      }

      toolCountBadge.textContent = `${list.length} Tools`;

      if (list.length === 0) {
        emptyState.style.display = "block";
      } else {
        emptyState.style.display = "none";
        list.forEach(tool => {
          const isFav = favorites.includes(tool.id);
          const card = document.createElement("div");
          card.className = "tool-card";
          card.innerHTML = `

            </div>

          card.onclick = () => openToolModal(tool);
          toolsGrid.appendChild(card);
        });
      }

              <button class="calc-btn" onclick="calcInput('3')">3</button>
              <button class="calc-btn op" onclick="calcInput('+')">+</button>
              <button class="calc-btn" onclick="calcInput('0')">0</button>
              <button class="calc-btn" onclick="calcInput('.')">.</button>
              <button class="calc-btn eq" onclick="calcInput('=')">=</button>
            </div>
          `;

        // 3. Age Calculator
        case 3:
          return `
            <div class="tool-input-group">
              <label>আপনার জন্মতারিখ নির্বাচন করুন</label>
              <input type="date" id="birthDate" class="tool-input" value="2000-01-01">
            </div>
            <button class="tool-btn" onclick="calculateAge()">বয়স হিসাব করুন</button>
            <div class="result-card" id="ageResultBox" style="display:none;">
              <h5>বর্তমান বয়স</h5>
              <div class="result-value" id="ageResultText">0 বছর</div>
              <p id="ageSubDetails" style="font-size:13px; color:var(--text-muted); margin-top:6px;"></p>
            </div>
          `;

        // 6. Digital Tasbih
        case 6:
          return `
            <div style="text-align:center; padding: 20px 0;">
              <div style="font-size:64px; font-weight:800; color:var(--primary);" id="tasbihCount">0</div>
              <p style="color:var(--text-muted); font-size:14px; margin-bottom:24px;">টার্গেট: ৩৩ / ১০০</p>
              <button style="width:130px; height:130px; border-radius:50%; background:var(--primary); color:#fff; border:none; font-size:24px; font-weight:800; cursor:pointer; box-shadow:0 10px 25px rgba(37,99,235,0.3);" onclick="countTasbih()">
                সুবহানাল্লাহ
              </button>
              <div style="margin-top:24px;">
                <button class="tool-input" style="width:auto; padding:8px 18px; cursor:pointer;" onclick="resetTasbih()">রিসেট কাউন্টার</button>
              </div>
            </div>
          `;

        // 11. Cash Counter
        case 11:
          return `
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:12px;">নোট সংখ্যা ইনপুট দিন, স্বয়ংক্রিয় মোট টাকা হিসাব হবে:</p>
            <div style="display:flex; flex-direction:column; gap:8px;">
              ${[1000, 500, 200, 100, 50, 20, 10, 5].map(note => `
                <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
                  <strong style="width:70px;">৳ ${note}</strong>
                  <input type="number" min="0" placeholder="সংখ্যা" class="tool-input note-input" data-note="${note}" oninput="calcCashTotal()" style="padding:6px 10px;">
                  <span class="note-subtotal" id="sub_${note}" style="width:100px; text-align:right; font-weight:600; font-size:13px;">৳ 0</span>
                </div>
              `).join('')}
            </div>
            <div class="result-card">
              <h5>মোট জমা ক্যাশ</h5>
              <div class="result-value" id="cashGrandTotal">৳ 0</div>
            </div>
          `;

        // 21. QR Code Generator
        case 21:
          return `
            <div class="tool-input-group">
              <label>টেক্সট বা ওয়েবসাইটের লিঙ্ক দিন</label>
              <input type="text" id="qrText" class="tool-input" placeholder="https://example.com" value="https://google.com">
            </div>
            <button class="tool-btn" onclick="genQrCode()">কিউআর কোড তৈরি করুন</button>
            <div style="text-align:center; margin-top:20px;" id="qrImageWrap">
              <img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://google.com" style="border-radius:12px; border:1px solid var(--border); padding:8px; background:#fff;">
            </div>
          `;

        // 32. Word & Character Counter
        case 32:
          return `
            <div class="tool-input-group">
              <label>আপনার টেক্সট এখানে পেস্ট বা টাইপ করুন</label>
              <textarea id="wordInput" class="tool-input" rows="5" placeholder="এখানে লিখুন..." oninput="countWords()"></textarea>
            </div>
            <div class="result-card">
              <div class="unit-row"><span>শব্দ (Words):</span> <strong id="resWords">0</strong></div>
              <div class="unit-row"><span>বর্ণ (Characters):</span> <strong id="resChars">0</strong></div>
              <div class="unit-row"><span>স্পেস ছাড়া বর্ণ:</span> <strong id="resCharsNoSpace">0</strong></div>
              <div class="unit-row"><span>প্যারাগ্রাফ:</span> <strong id="resParas">0</strong></div>
            </div>
          `;

        // 54. Length Converter
        case 54:
          return `
            <div class="tool-input-group">
              <label>মান ইনপুট দিন (মিটারে)</label>
              <input type="number" id="lengthInput" class="tool-input" value="1" oninput="convertLength()">
            </div>
            <div class="result-card">
              <div class="unit-row"><span>কিলোমিটার (km):</span> <strong id="lenKm">0.001 km</strong></div>
              <div class="unit-row"><span>সেন্টিমিটার (cm):</span> <strong id="lenCm">100 cm</strong></div>
              <div class="unit-row"><span>ফুট (Feet):</span> <strong id="lenFt">3.2808 ft</strong></div>
              <div class="unit-row"><span>ইঞ্চি (Inches):</span> <strong id="lenIn">39.37 in</strong></div>
              <div class="unit-row"><span>মাইল (Miles):</span> <strong id="lenMi">0.00062 mi</strong></div>
            </div>
          `;

        // 57. Land / Area Measurement
        case 57:
          return `
            <div class="tool-input-group">
              <label>মোট বর্গফুট (Square Feet) লিখুন</label>
              <input type="number" id="landSqFt" class="tool-input" value="14400" oninput="calcLandUnits()">
            </div>
            <div class="result-card">
              <h5>ঐতিহ্যবাহী ও আধুনিক জমির হিসাব</h5>
              <div class="unit-row"><span>শতক / ডেসিমেল:</span> <strong id="landShatak" style="color:var(--primary);">33.06 শতক</strong></div>
              <div class="unit-row"><span>কাঠা (Katha):</span> <strong id="landKatha">20.00 কাঠা</strong></div>
              <div class="unit-row"><span>বিঘা (Bigha):</span> <strong id="landBigha">1.00 বিঘা</strong></div>
              <div class="unit-row"><span>একর (Acre):</span> <strong id="landAcre">0.33 একর</strong></div>
              <div class="unit-row"><span>বর্গমিটার (Sq. Meter):</span> <strong id="landSqM">1337.8 m²</strong></div>
            </div>
          `;

        // 67. BMI Calculator
        case 67:
          return `
            <div class="tool-input-group">
              <label>ওজন (কেজি)</label>
              <input type="number" id="bmiWeight" class="tool-input" value="68">
            </div>
            <div class="tool-input-group">
              <label>উচ্চতা (সেন্টিমিটার)</label>
              <input type="number" id="bmiHeight" class="tool-input" value="172">
            </div>
            <button class="tool-btn" onclick="calcBmi()">বিএমআই হিসাব করুন</button>
            <div class="result-card" id="bmiResultBox" style="margin-top:14px;">
              <h5>আপনার বডি ম্যাস ইনডেক্স (BMI)</h5>
              <div class="result-value" id="bmiValue">23.0</div>
              <p id="bmiCategory" style="font-weight:700; color:var(--success); margin-top:4px;">স্বাভাবিক ও সুস্থ ওজন</p>
            </div>
          `;

        // Default Fallback Interface for any other tool
        default:
          return `
            <div style="text-align:center; padding:24px 0;">
              <div style="font-size:48px; margin-bottom:12px;">${ALL_TOOLS.find(t=>t.id===id)?.icon || '⚡'}</div>
              <h4 style="font-size:16px; font-weight:700; margin-bottom:6px;">${ALL_TOOLS.find(t=>t.id===id)?.name}</h4>
              <p style="font-size:13px; color:var(--text-muted); margin-bottom:18px;">${ALL_TOOLS.find(t=>t.id===id)?.desc}</p>
              <div class="result-card">
                <p style="font-size:13px; font-weight:600; color:var(--primary);">✅ অফলাইন ইউটিলিটি প্রস্তুত</p>
                <p style="font-size:12px; color:var(--text-muted); margin-top:4px;">ডিভাইস হার্ডওয়্যার ও অ্যান্ড্রয়েড লাইব্রেরি ইন্টিগ্রেশনের মাধ্যমে সক্রিয়।</p>
              </div>
            </div>
          `;
      }
    }

    function setupToolLogic(id) {
      if (id === 57) calcLandUnits();
      if (id === 54) convertLength();
    }

    // ---------------------------------------------------------
    // CALCULATOR LOGIC
    // ---------------------------------------------------------
    let calcExpression = "";
    window.calcInput = function(val) {
      const display = document.getElementById("calcDisplay");
      if (val === 'C') {
        calcExpression = "";
        display.textContent = "0";
      } else if (val === '=') {
        try {
          const res = eval(calcExpression.replace(/×/g, '*').replace(/÷/g, '/'));
          display.textContent = res;
          calcExpression = String(res);
        } catch(e) {
          display.textContent = "Error";
          calcExpression = "";
        }
      } else {
        if (calcExpression === "0") calcExpression = "";
        calcExpression += val;
        display.textContent = calcExpression;
      }
    };

    // Age calculation
    window.calculateAge = function() {
      const bDate = new Date(document.getElementById("birthDate").value);
      const today = new Date();
      if (isNaN(bDate)) return;

      let years = today.getFullYear() - bDate.getFullYear();
      let months = today.getMonth() - bDate.getMonth();
      let days = today.getDate() - bDate.getDate();

      if (days < 0) {
        months--;
        days += 30;
      }
      if (months < 0) {
        years--;
        months += 12;
      }

      document.getElementById("ageResultBox").style.display = "block";
      document.getElementById("ageResultText").textContent = `${years} বছর`;
      document.getElementById("ageSubDetails").textContent = `${months} মাস, ${days} দিন বয়স`;
    };

    // Tasbih
    let tasbihCount = 0;
    window.countTasbih = function() {
      tasbihCount++;
      document.getElementById("tasbihCount").textContent = tasbihCount;
      if (navigator.vibrate) navigator.vibrate(30);
    };
    window.resetTasbih = function() {
      tasbihCount = 0;
      document.getElementById("tasbihCount").textContent = 0;
    };

    // Cash counter
    window.calcCashTotal = function() {
      let grandTotal = 0;
      document.querySelectorAll(".note-input").forEach(input => {
        const note = parseInt(input.dataset.note);
        const qty = parseInt(input.value) || 0;
        const sub = note * qty;
        grandTotal += sub;
        document.getElementById(`sub_${note}`).textContent = `৳ ${sub.toLocaleString()}`;
      });
      document.getElementById("cashGrandTotal").textContent = `৳ ${grandTotal.toLocaleString()}`;
    };

    // QR Code
    window.genQrCode = function() {
      const txt = encodeURIComponent(document.getElementById("qrText").value || "Mega Utility");
      document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${txt}`;
    };

    // Word counter
    window.countWords = function() {
      const text = document.getElementById("wordInput").value;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      const charsNoSpace = text.replace(/\s/g, '').length;
      const paras = text.trim() ? text.split(/\n+/).length : 0;

      document.getElementById("resWords").textContent = words;
      document.getElementById("resChars").textContent = chars;
      document.getElementById("resCharsNoSpace").textContent = charsNoSpace;
      document.getElementById("resParas").textContent = paras;
    };

    // Length conversion
    window.convertLength = function() {
      const m = parseFloat(document.getElementById("lengthInput").value) || 0;
      document.getElementById("lenKm").textContent = `${(m / 1000).toFixed(6)} km`;
      document.getElementById("lenCm").textContent = `${(m * 100).toFixed(2)} cm`;
      document.getElementById("lenFt").textContent = `${(m * 3.28084).toFixed(4)} ft`;
      document.getElementById("lenIn").textContent = `${(m * 39.3701).toFixed(2)} in`;
      document.getElementById("lenMi").textContent = `${(m * 0.000621371).toFixed(6)} mi`;
    };

    // Land calculation
    window.calcLandUnits = function() {
      const sqFt = parseFloat(document.getElementById("landSqFt").value) || 0;
      const shatak = sqFt / 435.6;
      const katha = sqFt / 720.0;
      const bigha = katha / 20.0;
      const acre = sqFt / 43560.0;
      const sqM = sqFt * 0.092903;

      document.getElementById("landShatak").textContent = `${shatak.toFixed(2)} শতক`;
      document.getElementById("landKatha").textContent = `${katha.toFixed(2)} কাঠা`;
      document.getElementById("landBigha").textContent = `${bigha.toFixed(3)} বিঘা`;
      document.getElementById("landAcre").textContent = `${acre.toFixed(4)} একর`;
      document.getElementById("landSqM").textContent = `${sqM.toFixed(1)} m²`;
    };

    // BMI calculation
    window.calcBmi = function() {
      const w = parseFloat(document.getElementById("bmiWeight").value) || 0;
      const hCm = parseFloat(document.getElementById("bmiHeight").value) || 170;
      const hM = hCm / 100;
      const bmi = w / (hM * hM);

      document.getElementById("bmiValue").textContent = bmi.toFixed(1);
      const catEl = document.getElementById("bmiCategory");
      if (bmi < 18.5) {
        catEl.textContent = "ওজন কম (Underweight)";
        catEl.style.color = "#0284c7";
      } else if (bmi < 25) {
        catEl.textContent = "স্বাভাবিক ও সুস্থ ওজন (Normal)";
        catEl.style.color = "#16a34a";
      } else if (bmi < 30) {
        catEl.textContent = "অতিরিক্ত ওজন (Overweight)";
        catEl.style.color = "#ea580c";
      } else {
        catEl.textContent = "স্থূলতা (Obese)";
        catEl.style.color = "#ef4444";
      }
    };

    // Initial render
    renderTools();
  </script>
</body>
</html>
